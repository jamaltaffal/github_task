name: Monorepo CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/ci-cd.yml"
permissions:
  contents: write

jobs:
  backend_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        working-directory: src/backend
        run: npm ci

      - name: Run tests
        working-directory: src/backend
        run: npm test


  frontend_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend exists
        run: |
          echo "Frontend is static HTML"
          ls src/frontend


  sonarqube_analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=github_task
            -Dsonar.projectName=github_task
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**


  simulate_deployment:
    runs-on: ubuntu-latest
    needs:
      - backend_tests
      - frontend_check
      - sonarqube_analysis
    steps:
      - name: Simulate Deployment
        run: |
          echo "🚀 Deployment started"
          sleep 2
          echo "📦 Deploying application..."
          sleep 2
          echo "✅ Deployment completed"

  create_release:
    runs-on: ubuntu-latest
    needs: simulate_deployment
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

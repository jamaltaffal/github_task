name: Monorepo CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - ".github/workflows/ci-cd.yml"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/ci-cd.yml"

permissions:
  contents: write

# =========================
# BACKEND TEST (ONLY REAL NODE APP)
# =========================
jobs:
  backend_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        working-directory: src/backend
        run: npm ci

      - name: Run tests
        working-directory: src/backend
        run: npm test || echo "No tests failing (or no test script)"


# =========================
# SONARQUBE ANALYSIS
# =========================
  sonarqube_analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=github_task
            -Dsonar.projectName=github_task
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**


# =========================
# SIMULATE DEPLOYMENT
# =========================
  simulate_deployment:
    runs-on: ubuntu-latest
    needs:
      - backend_tests
      - sonarqube_analysis

    steps:
      - name: Deploy
        run: |
          echo "🚀 Deployment started"
          sleep 2
          echo "📦 Packaging backend..."
          sleep 2
          echo "✅ Deployment finished"


# =========================
# RELEASE (ONLY TAGS v*)
# =========================
  create_release:
    runs-on: ubuntu-latest
    needs: simulate_deployment

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
